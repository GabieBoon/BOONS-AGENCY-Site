<!DOCTYPE html>
<!-- Link-preview image (og:image, 1200x630) for an artist page. tools/build-presskits.ps1
     fills in the {{placeholders}} from the artist page and screenshots it with Edge.
     WhatsApp often shows only a square cut from the middle (x 285-915), so the photo
     and the name sit in that middle square; the sides are extras for the wide preview. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0B0A0F; }
  body {
    position: relative; font-family: 'JetBrains Mono', monospace; color: #F5F1E8;
    background: radial-gradient(ellipse 60% 90% at 50% 100%, rgba(224,27,36,0.25), transparent 70%), #0B0A0F;
  }
  .mono { text-transform: uppercase; letter-spacing: 2px; }

  /* middle square: photo + name */
  .center { position: absolute; left: 285px; top: 0; width: 630px; height: 630px; }
  .center img { position: absolute; left: 75px; top: 0; width: 480px; height: 630px; object-fit: cover; object-position: center 18%; }
  .center::before, .center::after {           /* gradient edges, like the site's tiles */
    content: ''; position: absolute; top: 0; width: 5px; height: 630px; z-index: 2;
    background: linear-gradient(180deg, #FFC93C 0%, #FF9E2C 30%, #FF4D1C 65%, #E01B24 100%);
  }
  .center::before { left: 70px; } .center::after { right: 70px; }
  .fade { position: absolute; left: 75px; bottom: 0; width: 480px; height: 300px; z-index: 1;
    background: linear-gradient(to top, rgba(11,10,15,0.95) 10%, rgba(11,10,15,0) 100%); }
  .name {
    position: absolute; left: 0; right: 0; bottom: 70px; z-index: 3; margin: 0; text-align: center;
    font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 96px; line-height: 1;
    letter-spacing: -1px; text-transform: uppercase; text-shadow: 0 6px 30px rgba(0,0,0,0.6);
  }
  .tagline { position: absolute; left: 0; right: 0; bottom: 36px; z-index: 3; margin: 0; text-align: center; color: #FF4D1C; font-size: 17px; }

  /* sides: only in the wide preview */
  .left, .right { position: absolute; top: 0; height: 630px; width: 285px; box-sizing: border-box; padding: 56px 34px; display: flex; flex-direction: column; justify-content: space-between; }
  .left { left: 0; } .right { right: 0; align-items: flex-end; text-align: right; }
  .logo { width: 170px; }
  .label { color: #948FA3; font-size: 16px; line-height: 1.6; }
  .tags { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .tags span { border: 2px solid #6B0F1A; border-radius: 999px; padding: 7px 16px; font-size: 16px; }
  .url { color: #FF7A45; font-size: 17px; font-weight: 700; }
</style>
</head>
<body>
  <div class="left">
    <img class="logo" src="{{LOGO}}" alt="">
    <p class="label mono">Booking<br>&amp; press kit</p>
  </div>

  <div class="center">
    <img src="{{PHOTO}}" alt="">
    <div class="fade"></div>
    <h1 class="name">{{ARTIST}}</h1>
    <p class="tagline mono">{{TAGLINE}}</p>
  </div>

  <div class="right">
    <div class="tags mono">{{TAGS}}</div>
    <span class="url mono">boons-agency.nl</span>
  </div>
</body>
</html>
