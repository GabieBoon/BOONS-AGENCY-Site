<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>{{SUBJECT}}</title>
</head>
<body bgcolor="#0B0A0F" background="https://form.boons-agency.nl/bg-page.png" style="margin:0;padding:0;background-color:#0B0A0F;background-image:url(https://form.boons-agency.nl/bg-page.png);">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{PREHEADER}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0B0A0F" background="https://form.boons-agency.nl/bg-page.png" style="background-color:#0B0A0F;background-image:url(https://form.boons-agency.nl/bg-page.png);">
<tr><td align="center" style="padding:32px 14px;">

<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#181521" background="https://form.boons-agency.nl/bg-card.png" style="width:100%;max-width:600px;background-color:#181521;background-image:url(https://form.boons-agency.nl/bg-card.png);border:1px solid #2B2735;border-radius:12px;">

<tr><td style="padding:22px 28px 20px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td valign="middle"><img src="https://form.boons-agency.nl/boons-logo.png" width="120" height="27" alt="BOONS" style="display:block;border:0;outline:none;width:120px;height:auto;"></td>
    <td valign="middle" align="right" style="font-family:SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;color:#FF7A45;padding-left:12px;">{{LABEL}}</td>
  </tr>
  </table>
</td></tr>

<tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://form.boons-agency.nl/gradient.png" width="600" height="4" alt="" style="display:block;border:0;width:100%;height:4px;"></td></tr>

<tr><td style="padding:34px 28px 0;font-family:'Arial Black',Arial,Helvetica,sans-serif;font-size:42px;line-height:1.05;font-weight:900;text-transform:uppercase;color:#F5F1E8;">{{HEADING}}</td></tr>

<tr><td style="padding:16px 28px 26px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;color:#F5F1E8;">{{INTRO}}</td></tr>

<tr><td style="padding:0 28px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px dashed #3A3645;border-bottom:1px dashed #3A3645;">
  <tr><td style="padding:8px 0 10px;">{{ROWS}}</td></tr>
  </table>
</td></tr>

<tr><td style="padding:24px 28px 6px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#A9A4B8;">{{OUTRO}}</td></tr>

<tr><td style="padding:18px 28px 34px;">
  <a href="{{BUTTON_URL}}" style="display:inline-block;background:#E01B24;color:#0B0A0F;font-family:SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-weight:bold;font-size:13px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;padding:15px 24px;border-radius:4px;">{{BUTTON_TEXT}} &rarr;</a>
</td></tr>

<tr><td style="padding:18px 28px 22px;border-top:1px solid #2B2735;font-family:SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-size:11px;line-height:1.8;letter-spacing:1.5px;text-transform:uppercase;color:#948FA3;">
  {{SENDER}} &middot; <a href="mailto:Bookings@boons-agency.nl" style="color:#F5F1E8;text-decoration:none;white-space:nowrap;">Bookings@boons-agency.nl</a> &middot; <a href="https://boons-agency.nl" style="color:#F5F1E8;text-decoration:none;white-space:nowrap;">boons-agency.nl</a>
</td></tr>

</table>

<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">
<tr><td style="padding:18px 28px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#6F6A7E;">{{NOTICE}}</td></tr>
</table>

</td></tr>
</table>
</body>
</html>
